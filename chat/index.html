<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>TwoChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="join" class="card">
      <h1>TwoChat</h1>
      <p>Private 1-to-1 chat and calling.</p>
      <input id="name" maxlength="30" placeholder="Your name" autocomplete="nickname">
      <input id="room" maxlength="64" placeholder="Private room code" autocomplete="off">
      <button id="joinBtn">Join chat</button>
      <small>Use the same room code on both devices. Keep it private.</small>
    </section>

    <section id="chat" class="hidden">
      <header>
        <div><strong id="roomTitle">TwoChat</strong><span id="status">Connecting…</span></div>
        <div class="actions">
          <button id="voiceBtn" title="Voice call">📞</button>
          <button id="videoBtn" title="Video call">📹</button>
        </div>
      </header>
      <div id="messages" class="messages"></div>
      <form id="composer">
        <input id="message" maxlength="2000" placeholder="Message…" autocomplete="off">
        <button>Send</button>
      </form>
    </section>
  </main>

  <div id="call" class="call hidden">
    <div class="callTop"><strong id="callTitle">Call</strong><button id="hangup">✕</button></div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
    <div id="incoming" class="incoming hidden"><p id="incomingText">Incoming call</p><button id="accept">Accept</button><button id="decline">Decline</button></div>
    <div id="callControls"><button id="mute">Mute</button><button id="camera">Camera</button></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
